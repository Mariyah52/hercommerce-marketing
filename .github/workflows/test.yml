name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  voice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install packages
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Voiceover tests (no internet or API keys needed)
        run: node --test tests/voice.test.mjs tests/pick.test.mjs
